name: CI and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release or repair (for example v0.0.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  checks:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests and validate build
        run: npm test

  release:
    name: Publish tagged release
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Verify version tag points to main
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a version tag in vMAJOR.MINOR.PATCH format, got: $RELEASE_TAG" >&2
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main
          tag_commit=$(git rev-parse "$RELEASE_TAG^{commit}")
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Tagged commit $tag_commit is not on origin/main" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Test tagged source
        run: npm test

      - name: Set extension version from tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg version "$VERSION" '.version = $version' manifest.json > manifest.json.tmp
          mv manifest.json.tmp manifest.json

      - name: Build release package
        run: npm run build

      - name: Verify package version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          package="hackernews-hide-seen-${RELEASE_TAG}.zip"
          cp web-ext-artifacts/hackernews-hide-seen.zip "$package"
          unzip -p "$package" manifest.json | jq -e --arg version "$VERSION" '.version == $version' >/dev/null
          echo "PACKAGE=$package" >> "$GITHUB_ENV"

      - name: Create GitHub Release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "Hacker News Hide Seen $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "$PACKAGE" --clobber
